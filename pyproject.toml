[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kanerva"
version = "0.5.1"
description = "Long-term memory for coding agents: local, no LLM calls, hard token budget. Plugins for Claude Code, Codex, OpenCode, Copilot CLI and more, plus an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Artem Katolikov" }]
keywords = ["memory", "agent-memory", "long-term-memory", "claude-code", "opencode", "mcp", "context-engineering", "coding-agents", "sqlite", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
embeddings = ["model2vec>=0.6"]
onnx = ["onnxruntime>=1.18", "tokenizers>=0.19"]
transformers = ["sentence-transformers>=3"]
dev = ["pytest>=8", "ruff>=0.6"]
experiments = ["matplotlib", "tiktoken", "sentence-transformers>=3", "huggingface_hub", "scikit-learn", "pyarrow"]

[project.urls]
Homepage = "https://github.com/katolikov/kanerva"
Issues = "https://github.com/katolikov/kanerva/issues"
Paper = "https://github.com/katolikov/kanerva/blob/main/paper/paper.pdf"

[project.scripts]
kanerva = "kanerva.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kanerva"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E731", "E741"]
